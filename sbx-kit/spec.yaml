# agent-box mixin for Docker Sandboxes (kit schema v2).
# Adds the host's skills, plugins, Claude settings and git identity, plus the
# .NET SDK, oc and opencode, to the built-in `claude` or `opencode` agent.
# Run build.ps1 first. It fills files/ from the host config.
# Use: sbx kit add <sandbox> ./sbx-kit   or   sbx create claude --kit ./sbx-kit
schemaVersion: "2"
kind: mixin
name: agent-box
version: "0.1.0"
displayName: agent-box tools and config
description: Host skills, plugins, Claude settings, .NET SDK, oc and opencode for Orca workers.

permissions:
  network:
    allow:
      # install step
      - dot.net
      - builds.dotnet.microsoft.com
      - ci.dot.net
      - mirror.openshift.com
      # builds and package restores
      - api.nuget.org
      - npm.intility.com
      # opencode model endpoints
      - "*.ai.intility.app"
      # opencode fetches its model catalog at start and hangs without it
      - opencode.ai
      - models.opencode.ai

# opencode API keys. The proxy injects the real key for the domain. The agent
# only sees a placeholder. Set with: sbx secret set <service> -t <key>
credentials:
  - service: intility-glm-5-3
    description: opencode provider intility-glm-5-3
    apiKey:
      name: OPENCODE_API_KEY_INTILITY_GLM_5_3
      proxyManaged: true
      inject:
        - domain: aa1359-glm53-c487a184-llm.ai.intility.app
          header: Authorization
          scheme: bearer
  # npm.intility.com token from `npm login --auth-type=legacy` on the host.
  # npm sends no auth itself. The proxy adds the header.
  - service: npm-intility
    description: npm.intility.com registry token
    apiKey:
      name: NPM_INTILITY_TOKEN
      proxyManaged: true
      inject:
        - domain: npm.intility.com
          header: Authorization
          scheme: bearer

setup:
  install:
    - command: "sh /home/agent/.local/share/agent-box/install.sh"
      user: "0"
      description: .NET SDK, oc, opencode, Claude and git config
